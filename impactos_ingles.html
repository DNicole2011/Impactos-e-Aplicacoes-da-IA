			<section class="py-5 bg-dark text-white" id="negativos">
				<div class="container">
					<div class="row align-items-center mb-5">
						<div class="col-lg-7 col-md-6 text-start">
							<div class="intro-box p-4 p-md-5 rounded-3">
								<h2 class="fw-bold mb-3">Negative Impacts</h2>
								<h4 class="text-white mb-3">Understanding the Risks</h4>
								<p class="text-secondary fs-5 mb-0">
								Despite being very helpful in everyday life, AI can also bring problems. It can cause dependency, spread fake news, and even replace some jobs. Therefore, it is important to use it carefully without letting it do everything for us.
								</p>
							</div>
						</div>
						<div class="col-lg-5 col-md-6 text-center mt-4 mt-md-0">
							<div class="intro-img-wrapper">
								<img src="img/negativo.jpeg" alt="Negative Impacts of AI" class="img-fluid rounded shadow w-100">
							</div>
						</div>
					</div>
				</div>
				<div class="container">
					<div class="row">
						<div class="col-12">
							<div class="cards-container justify-content-between p-0 flex-wrap" style="display: flex; gap: 20px;">
								<div class="card-hover-effect" style="flex: 1; min-width: 280px;">
									<div class="face face1">
										<div class="content">
											<h2>Unemployment</h2>
											<p><strong>Mass automation and structural unemployment</strong><br><br>The replacement of human labor by machines and algorithms is one of the disadvantages of artificial intelligence. AI automates repetitive tasks in sectors such as logistics, customer service, banking, and manufacturing.<br><br>This represents a profound reorganization that can lead to structural unemployment and increase social inequalities.</p>
										</div>
									</div>
									<div class="face face2">
										<div class="card-img-wrapper">
											<img src="img/desemprego.jpeg">
										</div>
									</div>
								</div>
								<div class="card-hover-effect" style="flex: 1; min-width: 280px;">
									<div class="face face1">
										<div class="content">
											<h2>Privacy</h2>
											<p><strong>Data exploitation and privacy invasion</strong><br><br>Artificial intelligence systems require large volumes of data to function effectively. This constant need for collection raises serious concerns regarding user privacy and information security.<br><br>In many cases, it remains unclear whether data was obtained with consent or how it will be used. The abusive use of this information can lead to situations of surveillance, exposure, and improper manipulation.</p>
										</div>
									</div>
									<div class="face face2">
										<div class="card-img-wrapper">
											<img src="img/hacker.jpeg">
										</div>
									</div>
								</div>
								<div class="card-hover-effect" style="flex: 1; min-width: 280px;">
									<div class="face face1">
										<div class="content">
											<h2>Decisions</h2>
											<p><strong>Replacing human decisions in sensitive contexts</strong><br><br>The use of AI in judicial, medical, or educational decisions raises a crucial ethical question: to what extent should we delegate human decisions to automated systems? In many cases, algorithms may fail to consider individual contexts, emotional nuances, or social realities, compromising fairness, empathy, and equity in decisions.</p>
										</div>
									</div>
									<div class="face face2">
										<div class="card-img-wrapper">
											<img src="img/pensamento.jpg">
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</section>
			<section class="container my-5 py-4" id="positivos">
				<div class="row align-items-center g-4">
					<div class="col-lg-5">
						<div class="impactos-left-card">
							<div class="impactos-left-content">
								<h2 class="fw-bold mb-3">Positive Impacts</h2>
								<p class="mb-0">Based on the research conducted by group members, we have selected 6 main positive points.</p>
							</div>
						</div>
					</div>
					<div class="col-lg-7">
						<div class="d-flex flex-column gap-3">
							<div class="topico-horizontal-card">
								<div class="topico-numero">1</div>
								<div class="topico-texto">
									<strong>Automation and Productivity:</strong> AI automates repetitive tasks, increasing productivity in sectors such as industry, logistics, and financial services, allowing workers to focus on creative and strategic activities, reducing operating costs and optimizing processes.
								</div>
							</div>
							<div class="topico-horizontal-card">
								<div class="topico-numero">2</div>
								<div class="topico-texto">
									<strong>Healthcare:</strong> AI algorithms improve medical diagnoses, create personalized treatments, and optimize hospital resources, offering reliable and secure healthcare delivery systems.
								</div>
							</div>
							<div class="topico-horizontal-card">
								<div class="topico-numero">3</div>
								<div class="topico-texto">
									<strong>Education:</strong> AI tools enable personalized learning, adapting content to each student's needs and promoting greater inclusion for students with diverse profiles.
								</div>
							</div>
							<div class="topico-horizontal-card">
								<div class="topico-numero">4</div>
								<div class="topico-texto">
									<strong>Sustainability and Environment:</strong> AI assists in environmental monitoring, natural disaster forecasting, and supporting sustainability projects, contributing to a more balanced and ecological future.
								</div>
							</div>
							<div class="topico-horizontal-card">
								<div class="topico-numero">5</div>
								<div class="topico-texto">
									<strong>Public Services and Urban Mobility:</strong> Smart cities use AI to improve mobility, security, and public resource management, increasing efficiency and quality of life.
								</div>
							</div>
							<div class="topico-horizontal-card">
								<div class="topico-numero">6</div>
								<div class="topico-texto">
									<strong>Digital Inclusion and Service Personalization:</strong> AI platforms expand access to services, such as chatbots and personalized e-commerce recommendations, making experiences more dynamic and user-centric.
								</div>
							</div>
						</div>
					</div>
				</div>
			</section>
